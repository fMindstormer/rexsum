name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pytest and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install pytest
      - run: python -m pytest tests -q
      - name: The committed test cases, page, examples and README table are up to date
        run: |
          python tests/make_cases.py tests/cases.json > /dev/null
          python site/build_page.py
          git status --porcelain
          test -z "$(git status --porcelain)"

  v8:
    name: V8 with the v flag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tests/speed.mjs patterns.json tests/cases.json

  packages:
    name: pip and npm packages, installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: The wheel installs and prints the patterns of patterns.json
        run: |
          pip install build
          python -P -m build --outdir pydist .
          python -m venv /tmp/venv && /tmp/venv/bin/pip install pydist/*.whl
          cd /tmp && /tmp/venv/bin/rexsum --version
          /tmp/venv/bin/rexsum card | cmp - <(python -c "import json; print(json.load(open('$GITHUB_WORKSPACE/patterns.json'))['card']['pattern'])")
          /tmp/venv/bin/rexsum custom --weights 1,3 --mod 10 --length 8 > /dev/null
      - name: The npm package installs and exports them
        run: |
          (cd js && npm pack)
          mkdir /tmp/try && cd /tmp/try && npm init -y > /dev/null && npm install "$GITHUB_WORKSPACE"/js/rexsum-*.tgz
          node --input-type=module -e '
            import fs from "fs";
            import * as m from "rexsum";
            import { compileCustom } from "rexsum/compile";
            const lib = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + "/patterns.json", "utf8"));
            for (const [n, r] of Object.entries(lib)) if (m[n] !== r.pattern) throw new Error(n);
            if (!new RegExp(`^(?:${m.card})$`, "v").test("4111111111111111")) throw new Error("card");
            console.log(Object.keys(lib).length, "patterns;", compileCustom({ weights: [1, 3], length: 8 }).length, "characters for EAN-8");'

  browsers:
    name: ${{ matrix.browser }}, JavaScript off
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.64.1
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/browser.py patterns.json tests/cases.json --browser ${{ matrix.browser }} --report browser-${{ matrix.browser }}.json
      - run: python tests/generator.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: browser-${{ matrix.browser }}.json
